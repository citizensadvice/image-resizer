name: Run tests

on: workflow_call

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: |
          docker build -t image-resizer .
      - name: Run tests
        run: |
          docker compose run -e APP_ENV=test --rm app bundle exec rspec
